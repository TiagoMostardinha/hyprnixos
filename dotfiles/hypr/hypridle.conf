# hypridle 0.1.7. Timeouts are in seconds. Not hot-reloaded:
#   systemctl --user restart hypridle
# Idle inhibitors (video players, systemd-inhibit, fullscreen windows via
# rules.lua) stop every listener below from firing.

general {
    # `loginctl lock-session` (SUPER+L, lid close, before sleep) runs this.
    # The Quickshell lock ignores the call when already locked.
    lock_cmd = qs ipc call lock lock

    # Always lock before suspend; inhibit_sleep = 3 makes suspend wait until
    # the session lock is actually in place.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

# 2.5 min: fade the backlight down. Any input fades it back up.
listener {
    timeout = 150
    on-timeout = fade-brightness dim
    on-resume = fade-brightness restore
}

# 5 min: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off. Any input turns it back on.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 min: suspend, on battery only.
listener {
    timeout = 900
    on-timeout = suspend-on-battery
}
