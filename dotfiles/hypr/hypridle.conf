# Timeouts in seconds. Not hot-reloaded: systemctl --user restart hypridle
# Idle inhibitors (video players, fullscreen windows via rules.lua) pause it.

general {
    # `loginctl lock-session` (SUPER+L, lid, before sleep) runs this.
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # Suspend waits until the screen is locked.
    inhibit_sleep = 3
}

# 2.5 min: dim the backlight (saved and restored by brightnessctl).
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# 5 min: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 min: suspend, on battery only.
listener {
    timeout = 900
    on-timeout = systemd-ac-power || systemctl suspend
}
